name: Bug report
description: Something in Ohara doesn't work as described.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the docs website
        2. Click …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ohara version
      description: The image tag, such as `0.1.0`, or the commit.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: From `docker compose logs`. Remove tokens, hostnames, and anything private first.
      render: text
